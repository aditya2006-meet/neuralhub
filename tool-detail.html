<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NeuralHub — Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080c10;--surface:#0e1318;--surface2:#141b22;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--accent2:#4f8fff;--accent3:#ff6b6b;--text:#e8edf2;--muted:#6b7a8d;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(8,12,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .2s}.nav-links a:hover{color:var(--text)}
.nav-right{display:flex;gap:.75rem;align-items:center}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.5rem 1.2rem;border-radius:100px;font-size:.88rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.4rem 1rem .4rem .5rem;cursor:pointer;position:relative}
.user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,229,176,.2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600}
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.5rem;min-width:160px;display:none;z-index:200}
.user-pill:hover .user-dropdown{display:block}
.user-dropdown a,.user-dropdown button{display:block;width:100%;text-align:left;padding:.5rem .85rem;font-size:.85rem;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:8px;font-family:'DM Sans',sans-serif;transition:all .15s}
.user-dropdown a:hover,.user-dropdown button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.logout-btn{color:var(--accent3)!important}
.page{padding:7rem 3rem 4rem;max-width:1100px;margin:0 auto}
.back{color:var(--muted);font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:2rem;transition:color .2s}.back:hover{color:var(--text)}
.hero-section{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:flex-start;margin-bottom:3rem}
.tool-top{display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem}
.tool-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.tool-name{font-family:'Syne',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.02em}
.badge{font-size:.72rem;font-weight:500;padding:.25rem .7rem;border-radius:100px;margin-left:10px;vertical-align:middle}
.badge-free{background:rgba(0,229,176,.12);color:var(--accent);border:1px solid rgba(0,229,176,.2)}
.badge-pro{background:rgba(79,143,255,.12);color:var(--accent2);border:1px solid rgba(79,143,255,.2)}
.badge-new{background:rgba(255,107,107,.12);color:var(--accent3);border:1px solid rgba(255,107,107,.2)}
.tool-stats{display:flex;gap:1.5rem;margin-bottom:1rem}
.tool-stat{font-size:.85rem;color:var(--muted)}
.tool-stat strong{color:var(--text);font-weight:500}
.tool-desc-long{font-size:.95rem;color:var(--muted);line-height:1.7;font-weight:300;max-width:600px}
.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.tag{font-size:.75rem;padding:.25rem .7rem;border-radius:100px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;min-width:220px;text-align:center}
.action-price{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:.25rem}
.action-sub{font-size:.8rem;color:var(--muted);margin-bottom:1.25rem}
.btn-try{width:100%;padding:.8rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:.95rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:.6rem;transition:opacity .2s}
.btn-try:hover{opacity:.85}
.btn-save{width:100%;padding:.8rem;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:100px;font-size:.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-save:hover{background:rgba(255,255,255,.05)}.btn-save.saved{border-color:var(--accent);color:var(--accent)}
.divider{border:none;border-top:1px solid var(--border);margin:2.5rem 0}
.section-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:600;margin-bottom:1.25rem}

/* AI DEMO */
.demo-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:2.5rem}
.demo-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.demo-tab{padding:.4rem 1rem;border-radius:100px;font-size:.8rem;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.demo-tab:hover,.demo-tab.active{background:var(--accent);color:#080c10;border-color:var(--accent);font-weight:500}
.demo-input{width:100%;padding:.8rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;resize:vertical;min-height:100px;margin-bottom:.75rem;transition:border-color .2s;line-height:1.6}
.demo-input:focus{border-color:rgba(0,229,176,.4)}.demo-input::placeholder{color:var(--muted)}
.demo-select{padding:.65rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;margin-bottom:.75rem;cursor:pointer}
.demo-select option{background:var(--surface)}
.demo-run{padding:.7rem 1.6rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:.9rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s;display:flex;align-items:center;gap:8px}
.demo-run:hover{opacity:.85}.demo-run:disabled{opacity:.5;cursor:not-allowed}
.demo-output{margin-top:1.25rem;padding:1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:.88rem;color:var(--text);line-height:1.7;min-height:60px;white-space:pre-wrap;display:none;position:relative}
.demo-output.show{display:block}
.copy-output{position:absolute;top:.75rem;right:.75rem;padding:.3rem .75rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;font-size:.75rem;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.copy-output:hover{color:var(--accent);border-color:rgba(0,229,176,.3)}
.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.login-prompt{text-align:center;padding:2rem;background:rgba(0,229,176,.05);border:1px solid rgba(0,229,176,.15);border-radius:12px}
.login-prompt p{color:var(--muted);margin-bottom:1rem;font-size:.9rem}
.login-prompt a{color:var(--accent);text-decoration:none;font-weight:500}

/* REVIEWS */
.review-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
.star-row{display:flex;gap:4px;margin-bottom:1rem;align-items:center}
.star{font-size:1.6rem;cursor:pointer;color:#3a3f4a;transition:color .12s,transform .12s;background:none;border:none;padding:2px;line-height:1}
.star:hover,.star.hover,.star.active{color:#fbbf24;transform:scale(1.15)}
.star-label{font-size:.82rem;color:var(--muted);margin-left:.5rem}
.rating-breakdown{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1.25rem}
.rating-summary{display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem}
.rating-big{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;line-height:1;color:var(--text)}
.rating-stars-big{color:#fbbf24;font-size:1.1rem;letter-spacing:1px}
.rating-count{font-size:.8rem;color:var(--muted)}
.rating-bars{display:flex;flex-direction:column;gap:5px;flex:1}
.rb-row{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.rb-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
.rb-fill{height:100%;background:#fbbf24;border-radius:100px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.reviews-sort{display:flex;gap:6px;margin-bottom:1rem}
.rsort-btn{padding:.3rem .85rem;border-radius:100px;font-size:.78rem;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.rsort-btn.active{background:var(--surface2);color:var(--text);border-color:rgba(255,255,255,.15)}
.review-input{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;resize:vertical;min-height:80px;margin-bottom:.75rem;transition:border-color .2s}
.review-input:focus{border-color:rgba(0,229,176,.4)}.review-input::placeholder{color:var(--muted)}
.submit-review{padding:.65rem 1.4rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:.88rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.submit-review:disabled{opacity:.5;cursor:not-allowed}
.reviews-list{display:flex;flex-direction:column;gap:1rem}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
.review-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.reviewer{display:flex;align-items:center;gap:10px}
.rev-avatar{width:32px;height:32px;border-radius:50%;background:rgba(0,229,176,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;flex-shrink:0}
.rev-name{font-size:.88rem;font-weight:500}.rev-date{font-size:.75rem;color:var(--muted)}
.rev-stars{color:#fbbf24;font-size:.78rem;letter-spacing:2px}
.rev-comment{font-size:.88rem;color:var(--muted);line-height:1.6;font-weight:300}
.no-reviews{text-align:center;padding:2rem;color:var(--muted);font-size:.9rem}
@media(max-width:768px){nav{padding:1rem 1.5rem}.nav-links{display:none}.page{padding:6rem 1.5rem 3rem}.hero-section{grid-template-columns:1fr}}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:dotPulse 1s infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
#outputText{line-height:1.75;font-size:0.88rem;color:#c8d0da}
#outputText strong{color:#e8edf2}
</style>
<link rel="stylesheet" href="mobile.css"/>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
  <ul class="nav-links"><li><a href="tools.html">Explore</a></li><li><a href="dashboard.html">Dashboard</a></li></ul>
  <div class="nav-right" id="navRight"></div>
</nav>

<div class="page">
  <a href="tools.html" class="back">← Back to tools</a>
  <div id="content"><p style="color:var(--muted)">Loading tool…</p></div>
</div>

<script>
const API='https://neuralhub-backend.onrender.com/api';
let token=localStorage.getItem('nh_token'),currentUser=null,tool=null,selectedRating=0;
const slug=new URLSearchParams(window.location.search).get('slug');
const iconBg={text:'rgba(0,229,176,.1)',image:'rgba(79,143,255,.1)',code:'rgba(255,107,107,.1)',audio:'rgba(251,191,36,.1)',data:'rgba(0,229,176,.1)',agent:'rgba(79,143,255,.1)'};

const demoConfigs = {
  text: {
    title: '✍️ Text Generator',
    tabs: ['Blog Post','Social Media','Email','Ad Copy','General'],
    types: ['blog','social','email','ad','general'],
    placeholder: 'What do you want to write about?',
    endpoint: '/ai/text',
    getBody: (input, tab) => ({ prompt: input, type: ['blog','social','email','ad','general'][tab] })
  },
  image: {
    title: '🎨 Image Description',
    tabs: ['Describe Scene','Art Style','Product'],
    types: ['scene','art','product'],
    placeholder: 'Describe what you want to visualize…',
    endpoint: '/ai/describe',
    getBody: (input) => ({ prompt: input })
  },
  code: {
    title: '💻 Code Assistant',
    tabs: ['Generate','Explain','Refactor','Debug','Document'],
    types: ['generate','explain','refactor','debug','docs'],
    placeholder: 'Describe what code you need, or paste code here…',
    endpoint: '/ai/code',
    getBody: (input, tab, lang) => ({ prompt: input, type: ['generate','explain','refactor','debug','docs'][tab], language: lang })
  },
  audio: {
    title: '🎵 Text Processor',
    tabs: ['Clean Transcript','Format Script'],
    types: ['transcript','script'],
    placeholder: 'Paste your raw transcript or audio content here…',
    endpoint: '/ai/transcribe',
    getBody: (input) => ({ content: input })
  },
  data: {
    title: '📊 Data Analyzer',
    tabs: ['Bullet Points','Paragraph','Executive','Q&A'],
    types: ['bullet','paragraph','executive','qa'],
    placeholder: 'Paste your text, report, or data to analyze…',
    endpoint: '/ai/summarize',
    getBody: (input, tab) => ({ text: input, style: ['bullet','paragraph','executive','qa'][tab] })
  },
  agent: {
    title: '🤖 AI Agent',
    tabs: ['Complete Task','Plan Project','Research'],
    types: ['task','plan','research'],
    placeholder: 'Describe the task you want the AI agent to complete…',
    endpoint: '/ai/agent',
    getBody: (input) => ({ task: input })
  }
};

async function init(){
  await loadUser();renderNav();
  if(!slug){document.getElementById('content').innerHTML='<p style="color:var(--accent3)">No tool specified.</p>';return;}
  await loadTool();await loadReviews();
}

async function loadUser(){
  if(!token)return;
  try{const r=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${token}`}});if(r.ok){const d=await r.json();currentUser=d.user;}else{token=null;localStorage.removeItem('nh_token');}}catch(_){}
}

async function loadTool(){
  try{
    const r=await fetch(`${API}/tools/${slug}`);const d=await r.json();
    if(!d.success)throw new Error();
    tool=d.tool;document.title=`NeuralHub — ${tool.name}`;renderTool();
  }catch(_){document.getElementById('content').innerHTML='<p style="color:var(--accent3)">Tool not found.</p>';}
}

function renderTool(){
  const isSaved=currentUser?.savedTools?.includes(tool._id);
  const cfg=demoConfigs[tool.category]||demoConfigs.text;
  const isSub=tab=>tab===0;
  document.getElementById('content').innerHTML=`
    <div class="hero-section">
      <div>
        <div class="tool-top"><div class="tool-icon" style="background:${iconBg[tool.category]||'rgba(255,255,255,.05)'}">${tool.icon}</div><div><div class="tool-name">${tool.name}<span class="badge badge-${tool.badge}">${tool.badge.toUpperCase()}</span></div></div></div>
        <div class="tool-stats"><div class="tool-stat">⭐ <strong>${tool.averageRating||'—'}</strong></div><div class="tool-stat">💬 <strong>${tool.reviewCount}</strong> reviews</div><div class="tool-stat">👤 <strong>${fmt(tool.usageCount)}</strong> users</div></div>
        <div class="tool-desc-long">${tool.longDescription||tool.description}</div>
        <div class="tags">${(tool.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
      </div>
      <div class="action-card">
        <div class="action-price">${tool.badge==='free'?'Free':'$29'}</div>
        <div class="action-sub">${tool.badge==='free'?'100 calls/day':'per month'}</div>
        <button class="btn-try" onclick="focusDemo()">⚡ Try it now</button>
        <button class="btn-save${isSaved?' saved':''}" id="saveBtn" onclick="toggleSave()">${isSaved?'🔖 Saved':'🔖 Save tool'}</button>
      </div>
    </div>
    <hr class="divider"/>
    <div class="section-title">${cfg.title} — Live Demo</div>
    <div class="demo-box" id="demoBox">
      ${currentUser ? `
        <div class="demo-tabs" id="demoTabs">
          ${cfg.tabs.map((t,i)=>`<button class="demo-tab${i===0?' active':''}" onclick="switchDemoTab(${i},this)">${t}</button>`).join('')}
        </div>
        ${tool.category==='code'?`<select class="demo-select" id="langSelect"><option>javascript</option><option>python</option><option>typescript</option><option>java</option><option>c++</option><option>rust</option><option>go</option><option>sql</option></select>`:''}
        <textarea class="demo-input" id="demoInput" placeholder="${cfg.placeholder}"></textarea>
        <button class="demo-run" id="demoBtn" onclick="runDemo()">⚡ Run AI</button>
        <div class="demo-output" id="demoOutput"><button class="copy-output" onclick="copyOutput()">Copy</button><span id="outputText"></span></div>
      ` : `
        <div class="login-prompt">
          <p>Sign in to use this tool with real AI</p>
          <a href="index.html">Create free account →</a>
        </div>
      `}
    </div>
    <hr class="divider"/>
    <div class="section-title">⭐ Reviews</div>
    ${currentUser?`
    <div class="review-form">
      <div style="font-size:.88rem;font-weight:500;margin-bottom:.75rem">Leave a review</div>
      <div class="star-row" id="starRow">
        ${[1,2,3,4,5].map(i=>`<button class="star" data-val="${i}" onclick="setRating(${i})" onmouseenter="hoverRating(${i})" onmouseleave="leaveRating()">★</button>`).join('')}
        <span class="star-label" id="starLabel"></span>
      </div>
      <textarea class="review-input" id="reviewInput" placeholder="Share your experience…"></textarea>
      <button class="submit-review" id="submitBtn" onclick="submitReview()">Submit review</button>
    </div>`:`<p style="color:var(--muted);font-size:.88rem;margin-bottom:1.25rem"><a href="index.html" style="color:var(--accent)">Log in</a> to leave a review.</p>`}
    <div id="ratingBreakdown" style="display:none">
      <div class="rating-breakdown">
        <div class="rating-summary">
          <div>
            <div class="rating-big" id="avgBig">—</div>
            <div class="rating-stars-big" id="starsBig"></div>
            <div class="rating-count" id="ratingCount"></div>
          </div>
          <div class="rating-bars" id="ratingBars"></div>
        </div>
      </div>
      <div class="reviews-sort">
        <button class="rsort-btn active" onclick="sortReviews('newest',this)">Newest</button>
        <button class="rsort-btn" onclick="sortReviews('highest',this)">Highest</button>
        <button class="rsort-btn" onclick="sortReviews('lowest',this)">Lowest</button>
      </div>
    </div>
    <div class="reviews-list" id="reviewsList"><p class="no-reviews">Loading reviews…</p></div>
  `;
}

let currentTab=0;
function switchDemoTab(idx,btn){
  currentTab=idx;
  document.querySelectorAll('.demo-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cfg=demoConfigs[tool.category]||demoConfigs.text;
  document.getElementById('demoInput').placeholder=cfg.placeholder;
  document.getElementById('demoOutput').classList.remove('show');
}

function renderMarkdown(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:0.88em">$1</code>')
    .replace(/^### (.+)$/gm,'<div style="font-family:Syne,sans-serif;font-weight:700;margin:1rem 0 0.4rem;color:#e8edf2">$1</div>')
    .replace(/^## (.+)$/gm,'<div style="font-family:Syne,sans-serif;font-weight:700;font-size:1.05rem;margin:1.2rem 0 0.5rem;color:#e8edf2">$1</div>')
    .replace(/^# (.+)$/gm,'<div style="font-family:Syne,sans-serif;font-weight:800;font-size:1.2rem;margin:1.4rem 0 0.6rem;color:#e8edf2">$1</div>')
    .replace(/^\d+\. (.+)$/gm,'<div style="padding:3px 0 3px 1.5rem;position:relative"><span style="position:absolute;left:0;color:#00e5b0">→</span>$1</div>')
    .replace(/^[\-\*] (.+)$/gm,'<div style="padding:3px 0 3px 1.2rem;position:relative"><span style="position:absolute;left:0;color:#00e5b0">•</span>$1</div>')
    .replace(/\n\n/g,'<br/><br/>')
    .replace(/\n/g,'<br/>');
}

async function typewriter(el, text, speed=8) {
  el.innerHTML='';
  el.style.borderRight='2px solid var(--accent)';
  const rendered = renderMarkdown(text);
  const temp = document.createElement('div');
  temp.innerHTML = rendered;
  const plain = temp.textContent;
  let i=0;
  return new Promise(resolve => {
    const interval = setInterval(()=>{
      i += Math.ceil(plain.length / 200);
      if(i >= plain.length) {
        el.innerHTML = rendered;
        el.style.borderRight='none';
        clearInterval(interval);
        resolve();
      } else {
        el.textContent = plain.slice(0, i);
      }
    }, speed);
  });
}

async function runDemo(){
  const input=document.getElementById('demoInput')?.value?.trim();
  if(!input){showToast('Please enter some text first.');return;}
  if(!currentUser){showToast('Please log in to use the AI demo.');return;}
  const btn=document.getElementById('demoBtn');
  const out=document.getElementById('demoOutput');
  const outText=document.getElementById('outputText');
  btn.disabled=true;
  btn.innerHTML='<span style="display:inline-flex;gap:4px;align-items:center"><span class="dot-pulse"></span> Thinking…</span>';
  out.classList.remove('show');
  outText.innerHTML='';
  try{
    const cfg=demoConfigs[tool.category]||demoConfigs.text;
    const lang=document.getElementById('langSelect')?.value||'javascript';
    const body=cfg.getBody(input,currentTab,lang);
    const r=await fetch(`${API}${cfg.endpoint}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||'AI request failed');
    out.classList.add('show');
    await typewriter(outText, d.result);
    // Save to history
    if(currentUser && tool) {
      fetch(`${API}/history`, {
        method:'POST',
        headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
        body: JSON.stringify({
          toolSlug: tool.slug,
          toolName: tool.name,
          toolIcon: tool.icon,
          toolCategory: tool.category,
          action: 'ran_ai',
          prompt: input.slice(0, 200)
        })
      }).catch(()=>{});
    }
  }catch(err){
    outText.innerHTML='<span style="color:#ff6b6b">⚠️ '+err.message+'</span>';
    out.classList.add('show');
  }finally{
    btn.disabled=false;btn.innerHTML='⚡ Run AI';
  }
}

function showToast(msg){
  let t=document.getElementById('globalToast');
  if(!t){t=document.createElement('div');t.id='globalToast';t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:#131920;border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:0.6rem 1.5rem;font-size:0.85rem;opacity:0;transition:all 0.3s;z-index:9999;pointer-events:none;white-space:nowrap;color:#e8edf2';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2500);
}

function copyOutput(){
  const text=document.getElementById('outputText')?.textContent;
  if(text)navigator.clipboard.writeText(text).then(()=>{document.querySelector('.copy-output').textContent='Copied!';setTimeout(()=>{document.querySelector('.copy-output').textContent='Copy';},2000);});
}

function focusDemo(){document.getElementById('demoInput')?.focus();document.getElementById('demoBox')?.scrollIntoView({behavior:'smooth'});}

async function loadReviews(){
  if(!tool)return;
  try{
    const r=await fetch(`${API}/tools/${tool._id}/reviews`);const d=await r.json();
    const list=document.getElementById('reviewsList');if(!list)return;
    if(!d.reviews?.length){list.innerHTML='<p class="no-reviews">No reviews yet. Be the first!</p>';return;}
    list.innerHTML=d.reviews.map(rv=>{
      const ini=rv.user?.name?.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)||'?';
      const stars='★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating);
      const date=new Date(rv.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      return `<div class="review-card"><div class="review-header"><div class="reviewer"><div class="rev-avatar">${ini}</div><div><div class="rev-name">${rv.user?.name||'User'}</div><div class="rev-date">${date}</div></div></div><div class="rev-stars">${stars}</div></div><div class="rev-comment">${rv.comment}</div></div>`;
    }).join('');
  }catch(_){}
}

function setRating(val){
  selectedRating=val;
  const labels=['','Terrible','Bad','OK','Good','Excellent'];
  document.querySelectorAll('.star').forEach(s=>s.classList.toggle('active',+s.dataset.val<=val));
  const lbl=document.getElementById('starLabel');
  if(lbl) lbl.textContent = val ? labels[val] : '';
}
function hoverRating(val){
  document.querySelectorAll('.star').forEach(s=>s.classList.toggle('hover',+s.dataset.val<=val));
}
function leaveRating(){
  document.querySelectorAll('.star').forEach(s=>s.classList.remove('hover'));
}

function showBreakdown(reviews) {
  const bd = document.getElementById('ratingBreakdown');
  if (!bd || !reviews.length) return;
  bd.style.display = 'block';
  const avg = reviews.reduce((s,r)=>s+r.rating,0)/reviews.length;
  document.getElementById('avgBig').textContent = avg.toFixed(1);
  document.getElementById('starsBig').textContent = '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg));
  document.getElementById('ratingCount').textContent = reviews.length + ' review' + (reviews.length!==1?'s':'');
  const bars = document.getElementById('ratingBars');
  bars.innerHTML = [5,4,3,2,1].map(star => {
    const cnt = reviews.filter(r=>r.rating===star).length;
    const pct = reviews.length ? (cnt/reviews.length*100) : 0;
    return `<div class="rb-row"><span>${star}★</span><div class="rb-bar"><div class="rb-fill" style="width:${pct}%"></div></div><span>${cnt}</span></div>`;
  }).join('');
}
function renderReviews(reviews) {
  const list = document.getElementById('reviewsList');
  list.innerHTML = reviews.map(rv => {
    const ini = rv.user?.name?.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)||'U';
    const date = new Date(rv.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const stars = '★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating);
    return `<div class="review-card"><div class="review-header"><div class="reviewer"><div class="rev-avatar">${ini}</div><div><div class="rev-name">${rv.user?.name||'User'}</div><div class="rev-date">${date}</div></div></div><div class="rev-stars">${stars}</div></div><div class="rev-comment">${rv.comment}</div></div>`;
  }).join('');
}
function sortReviews(by, btn) {
  document.querySelectorAll('.rsort-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const sorted = [...(window._allReviews||[])];
  if (by==='newest') sorted.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  else if (by==='highest') sorted.sort((a,b)=>b.rating-a.rating);
  else if (by==='lowest') sorted.sort((a,b)=>a.rating-b.rating);
  renderReviews(sorted);
}
async function submitReview(){
  const comment=document.getElementById('reviewInput')?.value?.trim();
  if(!selectedRating){alert('Please select a star rating.');return;}
  if(!comment){alert('Please write a comment.');return;}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting…';
  try{
    const r=await fetch(`${API}/tools/${tool._id}/reviews`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({rating:selectedRating,comment})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.message);
    document.getElementById('reviewInput').value='';selectedRating=0;
    document.querySelectorAll('.star').forEach(s=>s.classList.remove('active'));
    const lbl=document.getElementById('starLabel');if(lbl)lbl.textContent='';
    await loadReviews();
  }catch(err){alert(err.message||'Could not submit review.');}
  finally{btn.disabled=false;btn.textContent='Submit review';}
}

async function toggleSave(){
  if(!currentUser){alert('Please log in first.');return;}
  try{
    const r=await fetch(`${API}/tools/${tool._id}/save`,{method:'POST',headers:{Authorization:`Bearer ${token}`}});
    const d=await r.json();
    if(d.success){const btn=document.getElementById('saveBtn');btn.classList.toggle('saved',d.saved);btn.textContent=d.saved?'🔖 Saved':'🔖 Save tool';currentUser.savedTools=d.savedTools;}
  }catch(_){}
}

function fmt(n){return n>=1000?(n/1000).toFixed(0)+'K':n||0;}

function renderNav(){
  const el=document.getElementById('navRight');
  if(!currentUser){el.innerHTML=`<button class="btn-ghost" onclick="window.location.href='index.html'">Log in</button>`;}
  else{const i=currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);el.innerHTML=`<div class="user-pill"><div class="user-avatar">${i}</div><span style="font-size:.85rem;font-weight:500">${currentUser.name.split(' ')[0]}</span><span style="color:var(--muted);font-size:.75rem">▾</span><div class="user-dropdown"><a href="dashboard.html">🏠 Dashboard</a><a href="tools.html">🔍 Explore</a><button class="logout-btn" onclick="logout()">Log out</button></div></div>`;}
}

function logout(){localStorage.removeItem('nh_token');window.location.href='index.html';}
init();
</script>
