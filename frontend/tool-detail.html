<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeuralHub — Tool Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080c10;--surface:#0e1318;--surface2:#141b22;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--accent2:#4f8fff;--accent3:#ff6b6b;--text:#e8edf2;--muted:#6b7a8d;--r:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(8,12,16,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
  .nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s}.nav-links a:hover{color:var(--text)}
  .nav-right{display:flex;gap:0.75rem;align-items:center}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1.2rem;border-radius:100px;font-size:0.88rem;cursor:pointer;font-family:'DM Sans',sans-serif}
  .btn-accent{background:var(--accent);color:#080c10;padding:0.5rem 1.4rem;border-radius:100px;font-size:0.88rem;font-weight:500;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none}
  .user-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:0.4rem 1rem 0.4rem 0.5rem;cursor:pointer;position:relative}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,229,176,0.2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600}
  .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.5rem;min-width:160px;display:none;z-index:200}
  .user-pill:hover .user-dropdown{display:block}
  .user-dropdown a,.user-dropdown button{display:block;width:100%;text-align:left;padding:0.5rem 0.85rem;font-size:0.85rem;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:8px;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .user-dropdown a:hover,.user-dropdown button:hover{background:rgba(255,255,255,0.05);color:var(--text)}
  .logout{color:var(--accent3)!important}

  .page{padding:7rem 3rem 4rem;max-width:1100px;margin:0 auto}
  .back{color:var(--muted);font-size:0.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:2rem;transition:color 0.2s}.back:hover{color:var(--text)}

  .hero-section{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:flex-start;margin-bottom:3rem;flex-wrap:wrap}
  .tool-top{display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem}
  .tool-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem}
  .tool-name{font-family:'Syne',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-0.02em}
  .badge{font-size:0.72rem;font-weight:500;padding:0.25rem 0.7rem;border-radius:100px;margin-left:10px;vertical-align:middle}
  .badge-free{background:rgba(0,229,176,0.12);color:var(--accent);border:1px solid rgba(0,229,176,0.2)}
  .badge-pro{background:rgba(79,143,255,0.12);color:var(--accent2);border:1px solid rgba(79,143,255,0.2)}
  .badge-new{background:rgba(255,107,107,0.12);color:var(--accent3);border:1px solid rgba(255,107,107,0.2)}
  .tool-stats{display:flex;gap:1.5rem;margin-bottom:1rem}
  .tool-stat{font-size:0.85rem;color:var(--muted)}
  .tool-stat strong{color:var(--text);font-weight:500}
  .tool-desc-long{font-size:0.95rem;color:var(--muted);line-height:1.7;font-weight:300;max-width:600px}
  .tags{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem}
  .tag{font-size:0.75rem;padding:0.25rem 0.7rem;border-radius:100px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

  .action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;min-width:220px;text-align:center}
  .action-price{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:0.25rem}
  .action-sub{font-size:0.8rem;color:var(--muted);margin-bottom:1.25rem}
  .btn-try{width:100%;padding:0.8rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:0.95rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:0.6rem;transition:opacity 0.2s}
  .btn-try:hover{opacity:0.85}
  .btn-save{width:100%;padding:0.8rem;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:100px;font-size:0.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
  .btn-save:hover{background:rgba(255,255,255,0.05)}
  .btn-save.saved{border-color:var(--accent);color:var(--accent)}

  .section-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:600;margin-bottom:1.25rem}
  .divider{border:none;border-top:1px solid var(--border);margin:2.5rem 0}

  /* DEMO */
  .demo-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:2.5rem}
  .demo-input{width:100%;padding:0.8rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;resize:vertical;min-height:80px;margin-bottom:0.75rem;transition:border-color 0.2s}
  .demo-input:focus{border-color:rgba(0,229,176,0.4)}
  .demo-input::placeholder{color:var(--muted)}
  .demo-run{padding:0.7rem 1.6rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:0.9rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.2s}
  .demo-run:hover{opacity:0.85}
  .demo-run:disabled{opacity:0.5;cursor:not-allowed}
  .demo-output{margin-top:1rem;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:0.88rem;color:var(--text);line-height:1.65;min-height:60px;white-space:pre-wrap;display:none}
  .demo-output.show{display:block}

  /* REVIEWS */
  .review-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
  .star-row{display:flex;gap:6px;margin-bottom:1rem}
  .star{font-size:1.4rem;cursor:pointer;opacity:0.3;transition:opacity 0.15s;background:none;border:none;padding:0}
  .star.active{opacity:1}
  .review-input{width:100%;padding:0.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;resize:vertical;min-height:80px;margin-bottom:0.75rem;transition:border-color 0.2s}
  .review-input:focus{border-color:rgba(0,229,176,0.4)}
  .review-input::placeholder{color:var(--muted)}
  .submit-review{padding:0.65rem 1.4rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:0.88rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
  .submit-review:disabled{opacity:0.5;cursor:not-allowed}
  .reviews-list{display:flex;flex-direction:column;gap:1rem}
  .review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
  .review-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem}
  .reviewer{display:flex;align-items:center;gap:10px}
  .rev-avatar{width:32px;height:32px;border-radius:50%;background:rgba(0,229,176,0.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;flex-shrink:0}
  .rev-name{font-size:0.88rem;font-weight:500}
  .rev-date{font-size:0.75rem;color:var(--muted)}
  .rev-stars{color:#fbbf24;font-size:0.78rem;letter-spacing:2px}
  .rev-comment{font-size:0.88rem;color:var(--muted);line-height:1.6;font-weight:300}
  .no-reviews{text-align:center;padding:2rem;color:var(--muted);font-size:0.9rem}

  @media(max-width:768px){nav{padding:1rem 1.5rem}.nav-links{display:none}.page{padding:6rem 1.5rem 3rem}.hero-section{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
  <ul class="nav-links">
    <li><a href="tools.html">Explore</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <div class="nav-right" id="navRight"></div>
</nav>

<div class="page">
  <a href="tools.html" class="back">← Back to tools</a>
  <div id="content"><p style="color:var(--muted)">Loading tool…</p></div>
</div>

<script>
const API = 'http://localhost:5000/api';
let token = localStorage.getItem('nh_token');
let currentUser = null;
let tool = null;
let selectedRating = 0;

const slug = new URLSearchParams(window.location.search).get('slug');
const iconBg = { text:'rgba(0,229,176,0.1)', image:'rgba(79,143,255,0.1)', code:'rgba(255,107,107,0.1)', audio:'rgba(251,191,36,0.1)', data:'rgba(0,229,176,0.1)', agent:'rgba(79,143,255,0.1)' };

async function init() {
  await loadUser();
  renderNav();
  if (!slug) { document.getElementById('content').innerHTML = '<p style="color:var(--accent3)">No tool specified.</p>'; return; }
  await loadTool();
  await loadReviews();
}

async function loadUser() {
  if (!token) return;
  try {
    const r = await fetch(`${API}/auth/me`, { headers:{ Authorization:`Bearer ${token}` } });
    if (r.ok) { const d = await r.json(); currentUser = d.user; }
    else { token = null; localStorage.removeItem('nh_token'); }
  } catch(_) {}
}

async function loadTool() {
  try {
    const r = await fetch(`${API}/tools/${slug}`);
    const d = await r.json();
    if (!d.success) throw new Error();
    tool = d.tool;
    document.title = `NeuralHub — ${tool.name}`;
    renderTool();
  } catch(_) {
    document.getElementById('content').innerHTML = '<p style="color:var(--accent3)">Tool not found or server offline.</p>';
  }
}

function renderTool() {
  const isSaved = currentUser?.savedTools?.includes(tool._id);
  document.getElementById('content').innerHTML = `
    <div class="hero-section">
      <div>
        <div class="tool-top">
          <div class="tool-icon" style="background:${iconBg[tool.category]||'rgba(255,255,255,0.05)'}">${tool.icon}</div>
          <div>
            <div class="tool-name">${tool.name}<span class="badge badge-${tool.badge}">${tool.badge.toUpperCase()}</span></div>
          </div>
        </div>
        <div class="tool-stats">
          <div class="tool-stat">⭐ <strong>${tool.averageRating || '—'}</strong> rating</div>
          <div class="tool-stat">💬 <strong>${tool.reviewCount}</strong> reviews</div>
          <div class="tool-stat">👤 <strong>${fmtNum(tool.usageCount)}</strong> users</div>
        </div>
        <div class="tool-desc-long">${tool.longDescription || tool.description}</div>
        <div class="tags">${(tool.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
      </div>
      <div class="action-card">
        <div class="action-price">${tool.badge === 'free' ? 'Free' : '$29'}</div>
        <div class="action-sub">${tool.badge === 'free' ? '100 calls/day included' : 'per month · 50K calls'}</div>
        <button class="btn-try" onclick="tryTool()">⚡ Try it now</button>
        <button class="btn-save ${isSaved?'saved':''}" id="saveBtn" onclick="toggleSave()">${isSaved ? '🔖 Saved' : '🔖 Save tool'}</button>
      </div>
    </div>

    <hr class="divider" />

    <div class="section-title">🧪 Live Demo</div>
    <div class="demo-box">
      <textarea class="demo-input" id="demoInput" placeholder="Enter your prompt or text here…"></textarea>
      <button class="demo-run" id="demoBtn" onclick="runDemo()">Run demo</button>
      <div class="demo-output" id="demoOutput"></div>
    </div>

    <hr class="divider" />

    <div class="section-title">⭐ Reviews</div>
    ${currentUser ? `
    <div class="review-form">
      <div style="font-size:0.88rem;font-weight:500;margin-bottom:0.75rem">Leave a review</div>
      <div class="star-row" id="starRow">
        ${[1,2,3,4,5].map(i=>`<button class="star" data-val="${i}" onclick="setRating(${i})">★</button>`).join('')}
      </div>
      <textarea class="review-input" id="reviewInput" placeholder="Share your experience with this tool…"></textarea>
      <button class="submit-review" id="submitReviewBtn" onclick="submitReview()">Submit review</button>
    </div>` : `<p style="color:var(--muted);font-size:0.88rem;margin-bottom:1.25rem"><a href="index.html" style="color:var(--accent)">Log in</a> to leave a review.</p>`}
    <div class="reviews-list" id="reviewsList"><p class="no-reviews">Loading reviews…</p></div>
  `;
}

async function loadReviews() {
  if (!tool) return;
  try {
    const r = await fetch(`${API}/tools/${tool._id}/reviews`);
    const d = await r.json();
    const list = document.getElementById('reviewsList');
    if (!list) return;
    if (!d.reviews?.length) { list.innerHTML = '<p class="no-reviews">No reviews yet. Be the first!</p>'; return; }
    list.innerHTML = d.reviews.map(rv => {
      const ini = rv.user?.name?.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) || '?';
      const stars = '★'.repeat(rv.rating) + '☆'.repeat(5-rv.rating);
      const date = new Date(rv.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      return `<div class="review-card">
        <div class="review-header">
          <div class="reviewer"><div class="rev-avatar">${ini}</div><div><div class="rev-name">${rv.user?.name||'User'}</div><div class="rev-date">${date}</div></div></div>
          <div class="rev-stars">${stars}</div>
        </div>
        <div class="rev-comment">${rv.comment}</div>
      </div>`;
    }).join('');
  } catch(_) {}
}

function setRating(val) {
  selectedRating = val;
  document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', +s.dataset.val <= val));
}

async function submitReview() {
  const comment = document.getElementById('reviewInput')?.value?.trim();
  if (!selectedRating) { alert('Please select a star rating.'); return; }
  if (!comment) { alert('Please write a comment.'); return; }
  const btn = document.getElementById('submitReviewBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch(`${API}/tools/${tool._id}/reviews`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ rating: selectedRating, comment })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    document.getElementById('reviewInput').value = '';
    selectedRating = 0;
    document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
    await loadReviews();
  } catch(err) { alert(err.message || 'Could not submit review.'); }
  finally { btn.disabled = false; btn.textContent = 'Submit review'; }
}

async function toggleSave() {
  if (!currentUser) { alert('Please log in first.'); return; }
  const btn = document.getElementById('saveBtn');
  try {
    const r = await fetch(`${API}/tools/${tool._id}/save`, { method:'POST', headers:{ Authorization:`Bearer ${token}` } });
    const d = await r.json();
    if (d.success) {
      btn.classList.toggle('saved', d.saved);
      btn.textContent = d.saved ? '🔖 Saved' : '🔖 Save tool';
      currentUser.savedTools = d.savedTools;
    }
  } catch(_) {}
}

async function runDemo() {
  const input = document.getElementById('demoInput').value.trim();
  if (!input) { alert('Enter some text to demo.'); return; }
  const btn = document.getElementById('demoBtn');
  const out = document.getElementById('demoOutput');
  btn.disabled = true; btn.textContent = 'Running…';
  out.classList.remove('show');
  // Simulated demo output (in production connect to real API)
  await new Promise(r => setTimeout(r, 1200));
  const demos = {
    text: `✨ Generated content:\n\nBased on your input "${input}", here's a polished version:\n\n"${input.charAt(0).toUpperCase()+input.slice(1)} — crafted with precision and optimized for maximum engagement. Perfect for your audience."`,
    image: `🖼️ Image generation request received!\n\nPrompt: "${input}"\nResolution: 1024×1024\nStyle: Photorealistic\nStatus: In production, this would generate a real image via the API.`,
    code: `💻 Code suggestion:\n\n// Based on: ${input}\nfunction solution(input) {\n  // AI-generated implementation\n  return input.trim().split('\\n').map(line => line.trim()).join('\\n');\n}`,
    audio: `🎵 Audio synthesis queued!\n\nText: "${input}"\nVoice: Neural-EN-1\nDuration: ~${Math.ceil(input.length/15)}s\nStatus: In production, this returns an audio file URL.`,
    data: `📊 Data analysis:\n\nQuery: "${input}"\n\nResults: 3 matching records found\nTrend: ↑ 12.4% vs last period\nAnomaly detected: None\nConfidence: 94.2%`,
    agent: `🤖 Agent task initiated!\n\nObjective: "${input}"\nSteps planned: 4\n1. Researching topic…\n2. Gathering data…\n3. Processing results…\n4. Generating output…\n\nStatus: In production, agent runs autonomously.`
  };
  out.textContent = demos[tool.category] || `✅ Processed: "${input}"\n\nResult: Demo output would appear here in production.`;
  out.classList.add('show');
  btn.disabled = false; btn.textContent = 'Run demo';
}

function tryTool() {
  if (!currentUser) { window.location.href = 'index.html'; return; }
  document.getElementById('demoInput')?.focus();
}

function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(0)+'K' : n; }

function renderNav() {
  const el = document.getElementById('navRight');
  if (!currentUser) {
    el.innerHTML = `<button class="btn-ghost" onclick="window.location='index.html'">Log in</button><a href="index.html" class="btn-accent">Get started</a>`;
  } else {
    const ini = currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    el.innerHTML = `<div class="user-pill"><div class="user-avatar">${ini}</div><span style="font-size:0.85rem;font-weight:500">${currentUser.name.split(' ')[0]}</span><span style="color:var(--muted);font-size:0.75rem">▾</span><div class="user-dropdown"><a href="dashboard.html">Dashboard</a><button class="logout" onclick="logout()">Log out</button></div></div>`;
  }
}

function logout() { localStorage.removeItem('nh_token'); window.location.href = 'index.html'; }

init();
</script>
</body>
</html>
