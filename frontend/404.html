<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NeuralHub — Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="mobile.css"/>
<style>
  :root{--bg:#080c10;--surface:#0e1318;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--text:#e8edf2;--muted:#6b7a8d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden}
  .glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,176,0.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
  .code{font-family:'Syne',sans-serif;font-size:8rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),#4f8fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
  h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:.75rem}
  p{color:var(--muted);font-size:.95rem;max-width:400px;line-height:1.6;margin-bottom:2rem}
  .actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
  .btn-primary{background:var(--accent);color:#080c10;padding:.75rem 1.8rem;border-radius:100px;font-size:.9rem;font-weight:500;text-decoration:none;font-family:'DM Sans',sans-serif;transition:opacity .2s}
  .btn-primary:hover{opacity:.85}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.75rem 1.8rem;border-radius:100px;font-size:.9rem;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .2s}
  .btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
  nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(8,12,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
</nav>
<div class="glow"></div>
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
<div class="actions">
  <a href="index.html" class="btn-primary">Go home</a>
  <a href="tools.html" class="btn-ghost">Browse tools</a>
</div>
<script src="animations.js"></script>
</body>
</html>
