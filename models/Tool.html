<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeuralHub — Browse AI Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#080c10;--surface:#0e1318;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--accent2:#4f8fff;--accent3:#ff6b6b;--text:#e8edf2;--muted:#6b7a8d;--r:16px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(8,12,16,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
  .nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s}.nav-links a:hover,.nav-links a.active{color:var(--text)}
  .nav-right{display:flex;gap:0.75rem;align-items:center}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1.2rem;border-radius:100px;font-size:0.88rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}.btn-ghost:hover{color:var(--text)}
  .btn-accent{background:var(--accent);color:#080c10;padding:0.5rem 1.4rem;border-radius:100px;font-size:0.88rem;font-weight:500;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none}
  .user-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:0.4rem 1rem 0.4rem 0.5rem;cursor:pointer;position:relative}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,229,176,0.2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600}
  .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.5rem;min-width:160px;display:none;z-index:200}
  .user-pill:hover .user-dropdown{display:block}
  .user-dropdown a,.user-dropdown button{display:block;width:100%;text-align:left;padding:0.5rem 0.85rem;font-size:0.85rem;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:8px;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .user-dropdown a:hover,.user-dropdown button:hover{background:rgba(255,255,255,0.05);color:var(--text)}
  .user-dropdown .logout{color:var(--accent3)}

  .page{padding:7rem 3rem 4rem;max-width:1280px;margin:0 auto}
  .page-header{margin-bottom:2.5rem}
  .page-title{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:0.5rem}
  .page-sub{color:var(--muted);font-size:0.95rem}

  .toolbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:2rem}
  .search-box{position:relative;flex:1;min-width:240px}
  .search-box input{width:100%;padding:0.75rem 1rem 0.75rem 2.6rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
  .search-box input:focus{border-color:rgba(0,229,176,0.4)}
  .search-box input::placeholder{color:var(--muted)}
  .search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted)}
  .filter-select{padding:0.72rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;cursor:pointer}
  .filter-select option{background:var(--surface)}

  .cats{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem}
  .cat{padding:0.4rem 1rem;border-radius:100px;font-size:0.82rem;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
  .cat:hover,.cat.active{background:var(--accent);color:#080c10;border-color:var(--accent);font-weight:500}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.25rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;transition:all 0.2s;cursor:pointer;position:relative}
  .card:hover{border-color:rgba(255,255,255,0.14);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem}
  .card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .badge{font-size:0.7rem;font-weight:500;padding:0.25rem 0.7rem;border-radius:100px}
  .badge-free{background:rgba(0,229,176,0.12);color:var(--accent);border:1px solid rgba(0,229,176,0.2)}
  .badge-pro{background:rgba(79,143,255,0.12);color:var(--accent2);border:1px solid rgba(79,143,255,0.2)}
  .badge-new{background:rgba(255,107,107,0.12);color:var(--accent3);border:1px solid rgba(255,107,107,0.2)}
  .card-name{font-family:'Syne',sans-serif;font-weight:600;font-size:1.05rem;margin-bottom:0.4rem}
  .card-desc{font-size:0.85rem;color:var(--muted);line-height:1.55;font-weight:300}
  .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}
  .card-meta{font-size:0.78rem;color:var(--muted);display:flex;gap:1rem}
  .save-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;opacity:0.5;transition:opacity 0.2s;padding:0}
  .save-btn:hover,.save-btn.saved{opacity:1}
  .view-btn{font-size:0.78rem;font-weight:500;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:letter-spacing 0.2s}
  .view-btn:hover{letter-spacing:0.03em}

  .empty{text-align:center;padding:4rem;color:var(--muted)}
  .empty .emoji{font-size:3rem;margin-bottom:1rem}

  .skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2,#141b22) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r)}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .sk-card{height:200px}

  @media(max-width:768px){nav{padding:1rem 1.5rem}.nav-links{display:none}.page{padding:6rem 1.5rem 3rem}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
  <ul class="nav-links">
    <li><a href="tools.html" class="active">Explore</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <div class="nav-right" id="navRight"></div>
</nav>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Browse AI Tools</h1>
    <p class="page-sub">Discover and deploy from our curated collection of <span id="toolCount">—</span> AI tools</p>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search tools, categories, tags…" oninput="applyFilters()" />
    </div>
    <select class="filter-select" id="sortSelect" onchange="applyFilters()">
      <option value="-usageCount">Most Popular</option>
      <option value="-averageRating">Top Rated</option>
      <option value="-createdAt">Newest</option>
    </select>
  </div>

  <div class="cats" id="cats">
    <button class="cat active" onclick="filterCat(this,'')">All</button>
    <button class="cat" onclick="filterCat(this,'text')">✍️ Text</button>
    <button class="cat" onclick="filterCat(this,'image')">🖼️ Image</button>
    <button class="cat" onclick="filterCat(this,'code')">💻 Code</button>
    <button class="cat" onclick="filterCat(this,'audio')">🎵 Audio</button>
    <button class="cat" onclick="filterCat(this,'data')">📊 Data</button>
    <button class="cat" onclick="filterCat(this,'agent')">🤖 Agents</button>
  </div>

  <div class="grid" id="grid">
    ${[...Array(6)].map(()=>`<div class="skeleton sk-card"></div>`).join('')}
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';
let token = localStorage.getItem('nh_token');
let currentUser = null;
let currentCat = '';
let allTools = [];

const iconBg = { text:'rgba(0,229,176,0.1)', image:'rgba(79,143,255,0.1)', code:'rgba(255,107,107,0.1)', audio:'rgba(251,191,36,0.1)', data:'rgba(0,229,176,0.1)', agent:'rgba(79,143,255,0.1)' };

async function init() {
  await loadUser();
  renderNav();
  await loadTools();
}

async function loadUser() {
  if (!token) return;
  try {
    const r = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.ok) { const d = await r.json(); currentUser = d.user; }
    else { token = null; localStorage.removeItem('nh_token'); }
  } catch(_) {}
}

async function loadTools() {
  try {
    const r = await fetch(`${API}/tools`);
    const d = await r.json();
    allTools = d.tools || [];
    document.getElementById('toolCount').textContent = allTools.length + '+';
    applyFilters();
  } catch(_) {
    document.getElementById('grid').innerHTML = '<div class="empty"><div class="emoji">⚠️</div><p>Cannot connect to backend. Make sure your server is running.</p></div>';
  }
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let filtered = allTools.filter(t => {
    const matchCat = !currentCat || t.category === currentCat;
    const matchQ = !q || t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || (t.tags||[]).some(tg=>tg.includes(q));
    return matchCat && matchQ;
  });
  if (sort === '-usageCount') filtered.sort((a,b) => b.usageCount - a.usageCount);
  else if (sort === '-averageRating') filtered.sort((a,b) => b.averageRating - a.averageRating);
  else filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  renderTools(filtered);
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = cat;
  applyFilters();
}

function renderTools(tools) {
  const grid = document.getElementById('grid');
  if (!tools.length) { grid.innerHTML = '<div class="empty"><div class="emoji">🔍</div><p>No tools found. Try a different search.</p></div>'; return; }
  const savedIds = currentUser?.savedTools || [];
  grid.innerHTML = tools.map(t => {
    const isSaved = savedIds.includes(t._id);
    return `
    <div class="card" onclick="goToTool('${t.slug}')">
      <div class="card-top">
        <div class="card-icon" style="background:${iconBg[t.category]||'rgba(255,255,255,0.05)'}">${t.icon}</div>
        <span class="badge badge-${t.badge}">${t.badge.toUpperCase()}</span>
      </div>
      <div class="card-name">${t.name}</div>
      <div class="card-desc">${t.description}</div>
      <div class="card-footer">
        <div class="card-meta">
          <span>⭐ ${t.averageRating || '—'}</span>
          <span>👤 ${fmtNum(t.usageCount)}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="save-btn ${isSaved?'saved':''}" title="${isSaved?'Unsave':'Save'}" onclick="toggleSave(event,'${t._id}',this)">${isSaved?'🔖':'🔖'}</button>
          <button class="view-btn">View →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(0)+'K' : n; }

function goToTool(slug) { window.location.href = `tool-detail.html?slug=${slug}`; }

async function toggleSave(e, id, btn) {
  e.stopPropagation();
  if (!currentUser) { alert('Please log in to save tools.'); return; }
  try {
    const r = await fetch(`${API}/tools/${id}/save`, { method:'POST', headers:{ Authorization:`Bearer ${token}` } });
    const d = await r.json();
    if (d.success) {
      btn.classList.toggle('saved', d.saved);
      currentUser.savedTools = d.savedTools;
    }
  } catch(_) {}
}

function renderNav() {
  const el = document.getElementById('navRight');
  if (!currentUser) {
    el.innerHTML = `<button class="btn-ghost" onclick="window.location='index.html'">Log in</button><a href="index.html" class="btn-accent">Get started</a>`;
  } else {
    const ini = currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    el.innerHTML = `<div class="user-pill"><div class="user-avatar">${ini}</div><span style="font-size:0.85rem;font-weight:500">${currentUser.name.split(' ')[0]}</span><span style="color:var(--muted);font-size:0.75rem">▾</span><div class="user-dropdown"><a href="dashboard.html">Dashboard</a><button class="logout" onclick="logout()">Log out</button></div></div>`;
  }
}

function logout() { localStorage.removeItem('nh_token'); window.location.href = 'index.html'; }

init();
</script>
</body>
</html>
