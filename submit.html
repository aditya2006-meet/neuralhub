<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NeuralHub — Submit a Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080c10;--surface:#0e1318;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--accent2:#4f8fff;--accent3:#ff6b6b;--text:#e8edf2;--muted:#6b7a8d;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(8,12,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .2s}.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-right{display:flex;gap:.75rem;align-items:center}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.5rem 1.2rem;border-radius:100px;font-size:.88rem;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.4rem 1rem .4rem .5rem;cursor:pointer;position:relative}
.user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,229,176,.2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600}
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.5rem;min-width:180px;display:none;z-index:200}
.user-pill:hover .user-dropdown{display:block}
.user-dropdown a,.user-dropdown button{display:block;width:100%;text-align:left;padding:.5rem .85rem;font-size:.85rem;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:8px;font-family:'DM Sans',sans-serif;transition:all .15s}
.user-dropdown a:hover,.user-dropdown button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.logout-btn{color:var(--accent3)!important}

.page{padding:7rem 3rem 5rem;max-width:780px;margin:0 auto}
.page-header{margin-bottom:2.5rem}
.page-title{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.5rem}
.page-sub{color:var(--muted);font-size:.95rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;margin-bottom:1.25rem}
.card-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:600;margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
.fg{margin-bottom:1.25rem}
.fg label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.fg label span{color:var(--accent3);margin-left:2px}
.fg input,.fg select,.fg textarea{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:rgba(0,229,176,.4)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--muted)}
.fg select option{background:var(--surface)}
.fg textarea{resize:vertical;min-height:100px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px}

.icon-picker{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.icon-opt{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:all .15s}
.icon-opt:hover,.icon-opt.selected{border-color:var(--accent);background:rgba(0,229,176,.08)}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.cat-opt{border:1px solid var(--border);border-radius:10px;padding:.65rem;text-align:center;cursor:pointer;transition:all .2s;font-size:.82rem;color:var(--muted)}
.cat-opt:hover,.cat-opt.selected{border-color:var(--accent);background:rgba(0,229,176,.08);color:var(--text)}
.cat-opt .co-icon{font-size:1.2rem;margin-bottom:3px}

.submit-row{display:flex;gap:1rem;align-items:center;margin-top:1.5rem;flex-wrap:wrap}
.btn-submit{padding:.85rem 2rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:.95rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s;display:flex;align-items:center;gap:8px}
.btn-submit:hover{opacity:.85}.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.btn-preview{padding:.85rem 2rem;border:1px solid var(--border);color:var(--text);border-radius:100px;font-size:.95rem;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-preview:hover{background:rgba(255,255,255,.05)}

.msg{font-size:.85rem;padding:.75rem 1rem;border-radius:10px;display:none;margin-bottom:1rem}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.25);color:#ff9999}
.msg.ok{background:rgba(0,229,176,.1);border:1px solid rgba(0,229,176,.25);color:var(--accent)}

.gate{text-align:center;padding:4rem 2rem}
.gate-icon{font-size:3rem;margin-bottom:1rem}
.gate-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.75rem}
.gate-sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem;line-height:1.6}
.btn-acc{background:var(--accent);color:#080c10;padding:.75rem 1.8rem;border-radius:100px;font-size:.92rem;font-weight:500;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}

.my-tools{margin-top:2.5rem}
.my-tools-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:600;margin-bottom:1rem}
.my-tool-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.my-tool-info{display:flex;align-items:center;gap:10px}
.my-tool-icon{font-size:1.4rem}
.my-tool-name{font-weight:500;font-size:.9rem}
.my-tool-cat{font-size:.75rem;color:var(--muted)}
.my-tool-actions{display:flex;gap:.5rem}
.btn-sm{padding:.35rem .85rem;border-radius:100px;font-size:.78rem;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s}
.btn-sm:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.btn-sm.danger:hover{color:var(--accent3);border-color:rgba(255,107,107,.3)}

.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#080c10;border-radius:50%;animation:sp .6s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:768px){nav{padding:1rem 1.5rem}.nav-links{display:none}.page{padding:6rem 1.5rem 4rem}.row2{grid-template-columns:1fr}.cat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
  <ul class="nav-links">
    <li><a href="tools.html">Explore</a></li>
    <li><a href="submit.html" class="active">Submit Tool</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <div class="nav-right" id="navRight"></div>
</nav>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Submit an AI Tool</h1>
    <p class="page-sub">Share your AI tool with 84,000+ developers on the marketplace.</p>
  </div>
  <div id="mainContent"></div>
</div>

<script>
const API='https://neuralhub-backend.onrender.com/api';
let token=localStorage.getItem('nh_token'),currentUser=null;
let selIcon='🤖',selCat='',selBadge='free';

const icons=['🤖','✍️','🖼️','💻','🎵','📊','🔍','⚡','🔌','🧠','🎨','📋','🎤','🌐','🔒','📱','🚀','💡'];
const cats=[{id:'text',icon:'✍️',label:'Text'},{id:'image',icon:'🖼️',label:'Image'},{id:'code',icon:'💻',label:'Code'},{id:'audio',icon:'🎵',label:'Audio'},{id:'data',icon:'📊',label:'Data'},{id:'agent',icon:'🤖',label:'Agent'}];

async function init(){
  if(token){try{const r=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${token}`}});if(r.ok){const d=await r.json();currentUser=d.user;}else{token=null;localStorage.removeItem('nh_token');}}catch(_){}}
  renderNav();
  renderMain();
}

function renderMain(){
  const el=document.getElementById('mainContent');
  if(!currentUser){
    el.innerHTML=`<div class="gate"><div class="gate-icon">🛠️</div><div class="gate-title">Developer account required</div><div class="gate-sub">You need to be logged in as a <strong>Developer</strong> to submit tools.<br/>Sign up free and choose the Developer role.</div><button class="btn-acc" onclick="window.location.href='index.html'">Sign up as Developer</button></div>`;
    return;
  }
  if(currentUser.role==='user'){
    el.innerHTML=`<div class="gate"><div class="gate-icon">⚠️</div><div class="gate-title">Developer role required</div><div class="gate-sub">Your account is set to "User". To submit tools you need a Developer account.<br/>Create a new account and select Developer, or contact support to upgrade.</div><button class="btn-acc" onclick="window.location.href='index.html'">Create Developer account</button></div>`;
    return;
  }
  el.innerHTML=`
    <div class="msg err" id="errMsg"></div>
    <div class="msg ok" id="okMsg"></div>
    <div class="card">
      <div class="card-title">🔤 Basic Information</div>
      <div class="fg"><label>Tool name <span>*</span></label><input type="text" id="tName" placeholder="e.g. TextGenius Pro"/></div>
      <div class="fg"><label>Short description <span>*</span></label><input type="text" id="tDesc" placeholder="One sentence about what it does (max 120 chars)" maxlength="120"/></div>
      <div class="fg"><label>Full description</label><textarea id="tLong" placeholder="Detailed description — features, use cases, how it works…"></textarea></div>
    </div>
    <div class="card">
      <div class="card-title">🎨 Icon</div>
      <div class="icon-picker" id="iconPicker">${icons.map(ic=>`<div class="icon-opt${ic===selIcon?' selected':''}" onclick="pickIcon(this,'${ic}')">${ic}</div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="card-title">📂 Category <span style="color:var(--accent3);font-size:.8rem">*</span></div>
      <div class="cat-grid">${cats.map(c=>`<div class="cat-opt${selCat===c.id?' selected':''}" id="cat-${c.id}" onclick="pickCat('${c.id}')"><div class="co-icon">${c.icon}</div>${c.label}</div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="card-title">💰 Plan & Tags</div>
      <div class="row2">
        <div class="fg"><label>Badge</label>
          <select id="tBadge" onchange="selBadge=this.value">
            <option value="free">Free</option>
            <option value="pro">Pro</option>
            <option value="new">New</option>
          </select>
        </div>
        <div class="fg"><label>Tags</label><input type="text" id="tTags" placeholder="ai, writing, gpt (comma separated)"/><div class="hint">Helps users find your tool</div></div>
      </div>
    </div>
    <div class="submit-row">
      <button class="btn-submit" id="submitBtn" onclick="submitTool()"><span class="spin" id="subSpin"></span><span id="subTxt">🚀 Submit Tool</span></button>
      <button class="btn-preview" onclick="previewTool()">Preview</button>
    </div>
    <div class="my-tools" id="myTools"></div>
  `;
  loadMyTools();
}

function pickIcon(el,icon){selIcon=icon;document.querySelectorAll('.icon-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');}
function pickCat(id){selCat=id;document.querySelectorAll('.cat-opt').forEach(e=>e.classList.remove('selected'));document.getElementById('cat-'+id).classList.add('selected');}

async function submitTool(){
  const name=document.getElementById('tName').value.trim();
  const desc=document.getElementById('tDesc').value.trim();
  const long=document.getElementById('tLong').value.trim();
  const tags=document.getElementById('tTags').value;
  const badge=document.getElementById('tBadge').value;
  if(!name){showErr('Tool name is required.');return;}
  if(!desc){showErr('Short description is required.');return;}
  if(!selCat){showErr('Please select a category.');return;}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;document.getElementById('subSpin').style.display='block';document.getElementById('subTxt').textContent='Submitting…';
  try{
    const r=await fetch(`${API}/submissions`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({name,description:desc,longDescription:long,icon:selIcon,category:selCat,badge,tags})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||(d.errors&&d.errors[0].msg)||'Submission failed.');
    showOk(`✅ "${name}" submitted! It's now live on the marketplace.`);
    document.getElementById('tName').value='';document.getElementById('tDesc').value='';document.getElementById('tLong').value='';document.getElementById('tTags').value='';
    loadMyTools();
  }catch(e){showErr(e.message);}
  finally{btn.disabled=false;document.getElementById('subSpin').style.display='none';document.getElementById('subTxt').textContent='🚀 Submit Tool';}
}

function previewTool(){
  const name=document.getElementById('tName').value.trim()||'Your Tool Name';
  const desc=document.getElementById('tDesc').value.trim()||'Your tool description will appear here.';
  alert(`Preview:\n\n${selIcon} ${name}\n\n${desc}\n\nCategory: ${selCat||'(none selected)'}\nBadge: ${selBadge}`);
}

async function loadMyTools(){
  const el=document.getElementById('myTools');
  if(!el)return;
  try{
    const r=await fetch(`${API}/submissions/mine`,{headers:{Authorization:`Bearer ${token}`}});
    const d=await r.json();
    if(!d.tools?.length){el.innerHTML='';return;}
    el.innerHTML=`<div class="my-tools-title">Your submitted tools (${d.tools.length})</div>`+d.tools.map(t=>`
      <div class="my-tool-item">
        <div class="my-tool-info"><div class="my-tool-icon">${t.icon}</div><div><div class="my-tool-name">${t.name}</div><div class="my-tool-cat">${t.category} · ${t.badge}</div></div></div>
        <div class="my-tool-actions">
          <button class="btn-sm" onclick="window.location.href='tool-detail.html?slug=${t.slug}'">View</button>
          <button class="btn-sm danger" onclick="deleteTool('${t._id}','${t.name}')">Delete</button>
        </div>
      </div>`).join('');
  }catch(_){el.innerHTML='';}
}

async function deleteTool(id,name){
  if(!confirm(`Delete "${name}"? This cannot be undone.`))return;
  try{
    await fetch(`${API}/submissions/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});
    loadMyTools();
  }catch(_){alert('Could not delete tool.');}
}

function showErr(m){const e=document.getElementById('errMsg');if(!e)return;e.textContent=m;e.classList.add('show');document.getElementById('okMsg').classList.remove('show');}
function showOk(m){const e=document.getElementById('okMsg');if(!e)return;e.textContent=m;e.classList.add('show');document.getElementById('errMsg').classList.remove('show');}

function renderNav(){
  const el=document.getElementById('navRight');
  if(!currentUser){el.innerHTML=`<a class="btn-ghost" href="index.html">Log in</a>`;}
  else{const i=currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);el.innerHTML=`<div class="user-pill"><div class="user-avatar">${i}</div><span style="font-size:.85rem;font-weight:500">${currentUser.name.split(' ')[0]}</span><span style="color:var(--muted);font-size:.75rem">▾</span><div class="user-dropdown"><a href="dashboard.html">🏠 Dashboard</a><a href="tools.html">🔍 Explore</a><button class="logout-btn" onclick="logout()">Log out</button></div></div>`;}
}
function logout(){localStorage.removeItem('nh_token');window.location.href='index.html';}
init();
</script>
</body>
</html>
