<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NeuralHub — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080c10;--surface:#0e1318;--border:rgba(255,255,255,0.07);--accent:#00e5b0;--accent3:#ff6b6b;--text:#e8edf2;--muted:#6b7a8d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:2.5rem;max-width:400px;width:100%}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);margin-bottom:2rem;display:block;text-decoration:none}.logo span{color:var(--accent)}
.title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:.5rem}
.sub{color:var(--muted);font-size:.88rem;margin-bottom:2rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.fg input{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.fg input:focus{border-color:rgba(0,229,176,.4)}.fg input::placeholder{color:var(--muted)}
.btn{width:100%;padding:.85rem;background:var(--accent);color:#080c10;border:none;border-radius:100px;font-size:.95rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:.83rem;padding:.6rem .9rem;border-radius:8px;margin-bottom:1rem;display:none}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.25);color:#ff9999}
.msg.ok{background:rgba(0,229,176,.1);border:1px solid rgba(0,229,176,.25);color:var(--accent)}
.strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s;background:var(--border)}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">Neural<span>Hub</span></a>
  <div class="title">Reset your password</div>
  <div class="sub">Enter your new password below.</div>
  <div class="msg err" id="errMsg"></div>
  <div class="msg ok" id="okMsg"></div>
  <div id="formArea">
    <div class="fg">
      <label>New password</label>
      <input type="password" id="newPass" placeholder="At least 6 characters" oninput="checkStrength()"/>
      <div class="strength" id="strength"></div>
    </div>
    <div class="fg">
      <label>Confirm password</label>
      <input type="password" id="confirmPass" placeholder="Repeat new password"/>
    </div>
    <button class="btn" id="resetBtn" onclick="resetPassword()">Reset password</button>
  </div>
</div>
<script>
const API = 'https://neuralhub-backend.onrender.com/api';
const token = new URLSearchParams(window.location.search).get('token');

function checkStrength() {
  const p = document.getElementById('newPass').value;
  const s = document.getElementById('strength');
  if (p.length < 4) { s.style.background='#ff6b6b'; s.style.width='30%'; }
  else if (p.length < 8) { s.style.background='#fbbf24'; s.style.width='60%'; }
  else { s.style.background='#00e5b0'; s.style.width='100%'; }
}

async function resetPassword() {
  const pass = document.getElementById('newPass').value;
  const conf = document.getElementById('confirmPass').value;
  const errEl = document.getElementById('errMsg');
  const okEl = document.getElementById('okMsg');
  errEl.classList.remove('show'); okEl.classList.remove('show');
  if (!pass || pass.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.add('show'); return; }
  if (pass !== conf) { errEl.textContent='Passwords do not match.'; errEl.classList.add('show'); return; }
  if (!token) { errEl.textContent='Invalid reset link.'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Resetting…';
  try {
    const r = await fetch(`${API}/auth/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const d = await r.json();
    if (d.success) {
      localStorage.setItem('nh_token', d.token);
      okEl.textContent = '✅ Password reset! Redirecting to dashboard…';
      okEl.classList.add('show');
      document.getElementById('formArea').style.opacity = '0.5';
      setTimeout(() => window.location.href = 'dashboard.html', 2000);
    } else {
      errEl.textContent = d.message || 'Reset failed.';
      errEl.classList.add('show');
      btn.disabled = false; btn.textContent = 'Reset password';
    }
  } catch(_) {
    errEl.textContent = 'Server error. Try again.';
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Reset password';
  }
}
</script>
</body>
</html>
